name: Build and Release

# Builds on master, PRs, tags, and manual runs.
# GitHub Releases are created only for tags matching v*.*.* (e.g. v0.7.1).
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          RELEASE_NAME="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build-linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Meson wraps and ccache
        uses: actions/cache@v6
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
            .ccache
          key: meson-linux-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-linux-${{ hashFiles('subprojects/*.wrap') }}-
            meson-linux-

      # Do not install distro FLTK: meson.build will then build 1.4.4 from
      # subprojects/fltk.wrap (needed for native file dialogs).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build meson pkg-config git python3 \
            libgl-dev libglu1-mesa-dev libpng-dev zlib1g-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libfontconfig1-dev \
            cppcheck

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and package
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          ./build_scripts/build-linux.sh --skip-dep-install --buildtype release
          ccache -s || true

      - name: Run tests
        run: just test

      - name: Run static analysis
        run: just check

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: burrtools-linux
          path: burrtools-${{ needs.version.outputs.version }}-linux-*.tar.gz
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev gcovr

    - name: Install just
      uses: extractions/setup-just@v4

    # `shell: bash` sets pipefail, so a gcovr failure is not masked by tee's
    # exit status.
    - name: Report coverage and generate HTML report
      shell: bash
      run: just coverage-html | tee coverage-summary.txt

    # Uploaded before the report body is built, so the body can link to it:
    # the artifact-url output does not exist until the upload has run.
    - name: Upload HTML coverage report
      id: coverage_artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-html
        path: coverage-html/

    - name: Build the coverage report body
      env:
        ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "## Test coverage"
          echo
          echo '```'
          grep -E '^(lines|functions|branches):' coverage-summary.txt
          echo '```'
          echo
          echo "Measured on ubuntu-latest with gcc. Coverage numbers are"
          echo "toolchain-specific, so this Linux figure is the canonical one for"
          echo "comparing across pull requests."
          echo
          # artifact-url is empty if the upload was skipped or failed; fall
          # back to the run, which lists whatever artifacts do exist.
          if [ -n "$ARTIFACT_URL" ]; then
            echo "Per-file breakdown: [coverage-html artifact]($ARTIFACT_URL)."
          else
            echo "Per-file breakdown: the coverage-html artifact on [this run]($RUN_URL)."
          fi
          echo "It is a zip -- GitHub does not serve artifact HTML directly, so"
          echo "download it and open index.html."
        } > coverage-report.md
        cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

    # A pull request from a fork is given a read-only token, so posting a
    # comment is not possible there. Those runs still get the same report in
    # the run summary written above.
    - name: Comment the coverage report on the pull request
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
           --body-file coverage-report.md --edit-last --create-if-none


  # Builds the Doxygen API reference. This job does not publish anything.
  # `just docs` fails the run on any Doxygen warning, which is the check worth
  # keeping on every repository, including forks.
  #
  # Gated to pull requests and master, matching `coverage` above. That is not
  # just symmetry: the `release` job downloads *every* artifact of the run into
  # one directory and attaches `artifacts/**/*` to the release, so a pages
  # artifact present on a tag run would end up as a release asset.
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # `just docs` stamps the docs with `git describe --tags`, which needs
        # the tags and enough history to find the most recent one.
        fetch-depth: 0

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y doxygen graphviz

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Generate API documentation
      run: just docs

    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: gendoc/html


  # Split from `docs` because deployment needs write access to Pages and an id
  # token, and a pull request from a fork must not be handed either. Keeping the
  # generation step in its own read-only job means forks still get their docs
  # build checked; only this job, which never runs for a pull request, deploys.
  #
  # Publish only from burr-tools/burr-tools. deploy-pages writes to GitHub Pages
  # for the repository that ran the workflow, and that call 404s when Pages is
  # not enabled. A fork such as hypnoz/burr-tools-rotations does not own
  # https://burr-tools.github.io/burr-tools/ and should not try to create a site.
  deploy-docs:
    needs: docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'burr-tools/burr-tools'
    permissions:
      pages: write
      id-token: write
    # GitHub Pages accepts one deployment at a time. Queue rather than cancel,
    # so a rapid second push to master cannot leave the site showing the older
    # of the two commits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5


  build-windows:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Meson wraps
        uses: actions/cache@v6
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
          key: meson-mingw-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-mingw-${{ hashFiles('subprojects/*.wrap') }}-
            meson-mingw-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build cmake mingw-w64 pkg-config zip

      - name: Build
        run: |
          meson setup build-win --cross-file cross-mingw64.txt --buildtype=release --werror -Dpython=disabled
          meson compile -C build-win
          x86_64-w64-mingw32-strip build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe

      - name: Package Windows binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          STAGE=$(mktemp -d)
          DEST="$STAGE/burrtools"
          mkdir -p "$DEST"
          cp build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe "$DEST/"
          cp -R examples "$DEST/examples"
          cp README.md COPYING "$DEST/"
          ARCHIVE="burrtools-${VERSION}-windows-x86_64.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" burrtools)
          rm -rf "$STAGE"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: burrtools-windows
          path: burrtools-${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Meson wraps and ccache
        uses: actions/cache@v6
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
            .ccache
          key: meson-macos-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-macos-${{ hashFiles('subprojects/*.wrap') }}-
            meson-macos-

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          brew install ccache meson ninja cmake pkg-config libpng
          export PATH="$(brew --prefix)/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          ./build_scripts/build-macos.sh --skip-dep-install --buildtype release
          strip -x build/burrtools build/burrTxt build/burrTxt2
          ccache -s || true

      - name: Run tests
        run: just test

      - name: Create macOS app bundle and DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ARCH="$(uname -m)"
          ./build_scripts/create-macos-bundle.sh "$VERSION"
          test -f "BurrTools-${VERSION}-macos-${ARCH}.dmg"

      - name: Package macOS CLI tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ARCH=$(uname -m)
          STAGE=$(mktemp -d)
          cp build/burrTxt "burrTxt-${VERSION}-macos-${ARCH}"
          cp build/burrTxt2 "burrTxt2-${VERSION}-macos-${ARCH}"
          cp README.md COPYING "$STAGE/"
          cp "burrTxt-${VERSION}-macos-${ARCH}" "burrTxt2-${VERSION}-macos-${ARCH}" "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/burrtools-${VERSION}-macos-${ARCH}-cli.zip" .)
          rm -rf "$STAGE"
          mkdir -p artifacts
          mv "BurrTools-${VERSION}-macos-${ARCH}.dmg" "burrtools-${VERSION}-macos-${ARCH}-cli.zip" artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: burrtools-macos
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, build-linux, build-windows, build-macos]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          awk '/^-{5,}/{if(++count==1)next; if(count==2)exit} count==1' NEWS > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "See the Assets section below for platform-specific downloads."
            echo
            echo "- Linux x86_64: \`burrtools-*-linux-*.tar.gz\`"
            echo "- Windows x86_64: \`burrtools-*-windows-x86_64.zip\`"
            echo "- macOS Apple Silicon: \`BurrTools-*.dmg\` (GUI) and \`burrtools-*-macos-*-cli.zip\` (command-line tools)"
          } >> notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: BurrTools ${{ needs.version.outputs.release_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
